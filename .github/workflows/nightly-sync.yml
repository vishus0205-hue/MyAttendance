name: SVKM Portal Nightly Attendance Sync

on:
  schedule:
    # SVKM SAP Portal only allows attendance queries between 6:00 PM and 7:00 AM IST (12:30 UTC - 01:30 UTC).
    # Using non-round minutes (avoiding :00 and :30) to bypass GitHub Actions runner queue congestion:
    # 1. 20:17 UTC = 01:47 AM IST (Primary early morning run, safely before the 7:00 AM IST cutoff)
    - cron: '17 20 * * *'
    # 2. 22:13 UTC = 03:43 AM IST (Secondary early morning refresh before students wake up)
    - cron: '13 22 * * *'
    # 3. 14:47 UTC = 08:17 PM IST (Evening run after daily college lectures and faculty upload)
    - cron: '47 14 * * *'
  # Allows you to manually trigger the sync from GitHub Actions UI anytime
  workflow_dispatch:
    inputs:
      targetUser:
        description: 'Target student email or ID (optional - leave blank to sync all users)'
        required: false
        default: ''
        type: string
      fullSync:
        description: 'Force full semester sync instead of 14-day incremental (true/false)'
        required: false
        default: 'false'
        type: string

jobs:
  sync-attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Node modules
        uses: actions/cache@v4
        id: node-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium with dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Ensure OS dependencies for cached Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Attendance Sync
        run: npm run sync:nightly -- "${{ github.event.inputs.targetUser }}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PORTAL_ENCRYPTION_SECRET: ${{ secrets.PORTAL_ENCRYPTION_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          PORTAL_URL: ${{ secrets.PORTAL_URL || 'https://sdc-sppap1.svkm.ac.in:50001/irj/portal' }}
          PORTAL_ALLOWED_HOSTS: ${{ secrets.PORTAL_ALLOWED_HOSTS || 'sdc-sppap1.svkm.ac.in' }}
          SYNC_TARGET_USER: ${{ github.event.inputs.targetUser }}
          FULL_SYNC: ${{ github.event.inputs.fullSync || 'false' }}
